<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body class="sign-in-page">
    <section class="sign-in-section">
        <div class="sign-in">
            <h1>Sign in to your account</h1>
            <form class="form" action="" id="form-login">
                <div class="email-box">
                    <label for="email">Your email</label>
                    <input class="input" type="email" name="email" id="email" placeholder="name@company.com">
                </div>
                <div class="password-box">
                    <label for="password">Password</label>
                    <input type="password" name="password" class="password input" id="password" placeholder="•••••••••">
                </div>
                <div class="form-button">
                    <button class="button submit" type="submit">Sign in</button>
                </div>
            </form>
            <p>Don't have an account yet? <a href="#">Sign up</a></p>
        </div>
    </section>
    
    <script src="../database/localstorage.js"></script>
</body>
</html>
